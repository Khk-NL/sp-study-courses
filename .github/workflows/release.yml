name: Bump version and release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version to release. current republishes the committed version; the others increment it. Ignored when a tag is given.
        type: choice
        options:
          - current
          - patch
          - minor
          - major
        default: patch
      tag:
        description: Optional existing tag to rebuild and publish, for example v2.6.3. Skips the version bump, commit and tagging.
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: inputs.tag == ''
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Run this workflow from main; got $GITHUB_REF_NAME." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install build tools
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run smoke tests
        run: pnpm test
      - name: Resolve the version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            manifest=$(node -p "require('./manifest.json').version")
            if [ "$INPUT_TAG" != "v$manifest" ]; then
              echo "$INPUT_TAG does not match the manifest version $manifest." >&2
              exit 1
            fi
            echo "version=$manifest" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Republishing $INPUT_TAG from its own commit."
          else
            node scripts/bump-version.mjs "${{ inputs.bump }}"
          fi
      - name: Build and package the release ZIP
        run: pnpm run package
      - name: Commit the version bump
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push origin "HEAD:$GITHUB_REF_NAME"
      # A push made with the workflow token does not start another workflow, so
      # this run publishes the ZIP itself instead of waiting for package.yml to
      # fire on the new tag. package.yml still publishes tags pushed by a person.
      - name: Tag the release
        if: inputs.tag == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          head=$(git rev-parse HEAD)
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tagged=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
            if [ "$tagged" != "$head" ]; then
              echo "Tag $tag already points at $tagged, not at this commit." >&2
              echo "Choose another version, or re-run with tag=$tag to republish it." >&2
              exit 1
            fi
            echo "$tag already points at this commit; republishing its release."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" sp-study-courses.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" sp-study-courses.zip --generate-notes --title "$tag" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Summarize
        run: |
          {
            echo "### v${{ steps.version.outputs.version }}"
            echo
            if [ "${{ inputs.tag }}" != "" ]; then
              echo "Republished ${{ inputs.tag }} from its own commit; no new commit or tag was created."
            else
              echo "Tag pushed and release published with the ZIP built by this run."
              echo "A tag push made with the workflow token does not start another workflow,"
              echo "so \`.github/workflows/package.yml\` did not run for it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
