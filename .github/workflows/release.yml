name: Release plugin ZIP

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package flat Super Productivity plugin
        shell: pwsh
        run: Compress-Archive -Path manifest.json,plugin.js,index.html,icon.svg,i18n,course-import-template.csv -DestinationPath sp-study-courses.zip
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "${{ github.ref_name }}" *> $null) {
            gh release upload "${{ github.ref_name }}" sp-study-courses.zip --clobber
          } else {
            gh release create "${{ github.ref_name }}" sp-study-courses.zip --generate-notes
          }
