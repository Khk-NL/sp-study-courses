name: Package plugin ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install build tools
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check the tag against the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const {version}=require('./manifest.json');const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(tag!==version){console.error('tag '+tag+' does not match manifest version '+version);process.exit(1)}console.log('tag '+tag+' matches manifest version '+version)"
      - name: Run smoke tests
        run: pnpm test
      - name: Build and package sp-study-courses.zip
        run: pnpm run package
      - uses: actions/upload-artifact@v4
        with:
          name: sp-study-courses-zip
          path: sp-study-courses.zip
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sp-study-courses-zip
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" sp-study-courses.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" sp-study-courses.zip --generate-notes --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
