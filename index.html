<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Courses & Timetable</title>
    <style>
      body { padding: var(--s3); }
      .page { max-width: 1050px; margin: 0 auto; }
      .toolbar, .actions, .week-nav, .course-head { display: flex; gap: var(--s); align-items: center; flex-wrap: wrap; }
      .toolbar, .course-head { justify-content: space-between; }
      .panel, .course, .class-card { border: 1px solid var(--divider-color); border-radius: 6px; padding: var(--s2); margin-bottom: var(--s2); }
      .semester-grid, .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
      .week-grid { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: var(--s); overflow-x: auto; }
      .week-grid.with-time-axis { grid-template-columns: 42px repeat(var(--day-count), minmax(120px, 1fr)); }
      .day { min-width: 120px; }
      .day h3 { color: var(--text-color-muted); font-size: .9rem; }
      .class-card { border-left: 5px solid var(--course-color); padding: var(--s); }
      .timeline { position: relative; min-height: 900px; border-top: 1px solid var(--divider-color); background: repeating-linear-gradient(to bottom, transparent 0, transparent 59px, var(--divider-color) 60px); }
      .timeline-hours { position: relative; height: 900px; color: var(--text-color-muted); font-size: .72rem; }
      .timeline-hours span { position: absolute; left: 0; transform: translateY(-.5em); }
      .timeline-track { position: relative; min-width: 0; height: 900px; }
      .timeline-card { position: absolute; left: 2px; right: 2px; min-height: 30px; overflow: hidden; margin: 0; padding: var(--s-half); font-size: .82rem; }
      .timeline-card strong, .timeline-card .muted { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .timeline-card .class-time { font-size: .75rem; }
      .timeline-time-label { color: var(--text-color-muted); font-size: .72rem; line-height: 1.1; white-space: nowrap; }
      .timeline-axis { min-width: 42px; padding-top: 31px; }
      .timeline-shared .timeline-card .class-time { display: none; }
      .display-toggle { margin-left: auto; }
      .view-tabs { display: flex; gap: 4px; margin: var(--s2) 0; padding: 4px; border: 1px solid var(--divider-color); border-radius: 8px; width: fit-content; }
      .view-tab.active { color: var(--text-color-most-intense); background: var(--plugin-accent, var(--c-accent)); border-color: transparent; }
      .view-panel[hidden] { display: none; }
      .current-time-line { position: absolute; left: 0; right: 0; z-index: 4; border-top: 2px solid #ef4444; pointer-events: none; }
      .current-time-line::before { content: ''; position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
      .current-course { outline: 2px solid var(--plugin-accent, var(--c-accent)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--plugin-accent, var(--c-accent)) 20%, transparent); }
      .plan-day, .today-block { margin-bottom: var(--s3); }
      .plan-course { border-left: 4px solid var(--course-color, var(--plugin-accent)); padding: var(--s2); margin: var(--s) 0; background: color-mix(in srgb, var(--plugin-accent, var(--c-accent)) 6%, transparent); }
      .task-list { margin: var(--s) 0 0; padding-left: 22px; }
      .task-row, .event-row { margin: 6px 0; }
      .badge { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 999px; font-size: .72rem; background: color-mix(in srgb, var(--plugin-accent, var(--c-accent)) 18%, transparent); }
      .course-actions { display: contents; } .course-actions > summary { display: none; }
      .warning { color: #b45309; }
      .danger { color: #dc2626; }
      .preview-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
      .preview-table th, .preview-table td { padding: 6px; border-bottom: 1px solid var(--divider-color); text-align: left; }
      .preview-scroll { max-height: 55vh; overflow: auto; }
      .help-copy { max-height: 68vh; overflow: auto; line-height: 1.6; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: var(--s); }
      .stat { padding: var(--s2); border: 1px solid var(--divider-color); border-radius: 6px; }
      .mobile-only, .bottom-nav { display: none; }
      .class-time, .muted { color: var(--text-color-muted); font-size: .9rem; }
      label { display: grid; gap: var(--s-half); }
      [hidden] { display: none !important; }
      input, select, textarea, button { font: inherit; }
      input, select, textarea { box-sizing: border-box; width: 100%; padding: var(--s); color: inherit; background: var(--input-bg); border: 1px solid var(--divider-color); border-radius: 4px; }
      button { cursor: pointer; }
      .primary, .plain { min-height: 40px; border-radius: 4px; padding: 8px 14px; }
      .primary { border: 0; background: var(--c-accent); color: var(--text-color-most-intense); }
      .plain { border: 1px solid var(--divider-color); background: transparent; color: inherit; }
      dialog { color: var(--text-color); background: var(--bg); border: 1px solid var(--divider-color); border-radius: 8px; width: min(700px, calc(100vw - 32px)); }
      dialog form { display: grid; gap: var(--s2); }
      .empty { color: var(--text-color-muted); text-align: center; padding: var(--s3); }
      .status { border-left: 5px solid var(--plugin-accent, var(--c-accent)); }
      .status-main { font-size: 1.15rem; }
      .status-main strong { color: var(--plugin-accent, var(--c-accent)); }
      .primary { background: var(--plugin-accent, var(--c-accent)); }
      body[data-density="compact"] { --s3: 16px; --s2: 10px; --s: 6px; }
      .hidden-input { display: none; }
      @media (max-width: 680px) {
        body { padding: 10px 10px 76px; } .page { max-width: 100%; } .semester-grid, .form-grid { grid-template-columns: 1fr; }
        .toolbar { align-items: flex-start; } .toolbar h1 { font-size: 1.2rem; } .toolbar .actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr auto; }
        .toolbar #export, .toolbar #sync-all, .toolbar #help, .toolbar #settings { display: none; } .mobile-only { display: inline-flex; }
        .week-grid, .week-grid.with-time-axis { display: block; overflow: visible; } .timeline-axis { display: none; } .day { min-width: 0; } .class-card { min-height: 44px; }
        .view-tabs { display: none; } .course-head { align-items: flex-start; } .course-actions { display: block; width: 100%; } .course-actions > summary { display: block; list-style: none; text-align: center; } .course-actions > .actions { margin-top: 8px; width: 100%; } .course-actions > .actions button { min-width: 44px; flex: 1 1 110px; }
        button, summary, input, select { min-height: 44px; } dialog { box-sizing: border-box; width: 100vw; max-width: none; height: 100dvh; max-height: none; margin: 0; border-radius: 0; border: 0; } dialog form { min-height: calc(100dvh - 32px); align-content: start; }
        .preview-table, .preview-table tbody, .preview-table tr, .preview-table td { display: block; width: 100%; box-sizing: border-box; } .preview-table thead { display: none; } .preview-table tr { margin-bottom: 10px; padding: 10px; border: 1px solid var(--divider-color); border-radius: 8px; } .preview-table td { border: 0; padding: 3px 0; }
        .bottom-nav { position: fixed; display: grid; grid-template-columns: repeat(4, 1fr); left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--divider-color); padding: 4px env(safe-area-inset-right) calc(4px + env(safe-area-inset-bottom)) env(safe-area-inset-left); } .bottom-nav button { border: 0; background: transparent; color: inherit; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="toolbar"><h1 data-i18n="UI.TITLE">Courses & Timetable</h1><div class="actions"><button id="import" class="plain" data-i18n="UI.IMPORT">Import</button><button id="export" class="plain" data-i18n="UI.EXPORT">Export</button><button id="sync-all" class="plain" data-i18n="UI.SYNC_ALL">Sync</button><button id="add" class="primary" data-i18n="UI.ADD_COURSE">Add course</button><button id="help" class="plain" data-i18n="UI.HELP">Help</button><button id="settings" class="plain" data-i18n="UI.SETTINGS">Settings</button><button id="mobile-more" class="plain mobile-only" aria-label="More">⋮</button></div></div>
      <input id="import-file" class="hidden-input" type="file" accept=".csv,.html,.htm,.xlsx,text/csv,text/html,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
      <section class="panel semester-switcher">
        <label><span data-i18n="UI.CURRENT_SEMESTER">Current semester</span><select id="semester-select"></select></label>
        <div class="actions"><button id="new-semester" class="plain" data-i18n="UI.NEW_SEMESTER">New semester</button><button id="edit-semester" class="plain" data-i18n="UI.EDIT_SEMESTER">Edit semester</button><button id="clear-semester" class="plain" data-i18n="UI.CLEAR_SEMESTER">Clear current timetable</button></div>
      </section>
      <dialog id="semester-dialog"><form id="semester-form">
        <h2 data-i18n="UI.SEMESTER">Semester</h2>
        <div class="semester-grid">
          <label><span data-i18n="UI.SEMESTER_NAME">Semester name</span><input id="semester-name" /></label>
          <label><span data-i18n="UI.START_DATE">First Monday</span><input id="semester-start" type="date" /></label>
          <label><span data-i18n="UI.WEEKS">Weeks</span><input id="semester-weeks" type="number" min="1" max="40" value="18" /></label>
        </div>
        <div class="actions"><button id="semester-cancel" type="button" class="plain" data-i18n="UI.CANCEL">Cancel</button><button id="save-semester" class="primary" data-i18n="UI.SAVE_SEMESTER">Save semester</button></div>
      </form></dialog>
      <nav class="view-tabs" aria-label="Workspace views"><button class="plain view-tab active" data-view="timetable" data-i18n="UI.VIEW_TIMETABLE">Timetable</button><button class="plain view-tab" data-view="plan" data-i18n="UI.VIEW_PLAN">Plan</button><button class="plain view-tab" data-view="today" data-i18n="UI.VIEW_TODAY">Today</button></nav>
      <section id="view-timetable" class="view-panel">
        <div class="week-nav"><button id="prev" class="plain" data-i18n="UI.PREVIOUS">Previous</button><strong id="week-label"></strong><button id="next" class="plain" data-i18n="UI.NEXT">Next</button><select id="display-mode" class="display-toggle" aria-label="Display mode"><option value="timeline" data-i18n="UI.TIMELINE">Timeline</option><option value="list" data-i18n="UI.LIST">Compact list</option></select></div>
        <section class="panel status" aria-live="polite"><div id="current-status" class="status-main"></div><div id="next-status" class="muted"></div></section>
        <section id="timetable" class="week-grid"></section>
        <section><h2 data-i18n="UI.COURSES">Courses</h2><div id="courses"></div></section>
      </section>
      <section id="view-plan" class="view-panel" hidden><div id="plan-view"></div></section>
      <section id="view-today" class="view-panel" hidden><div id="today-view"></div></section>
      <nav class="bottom-nav"><button data-mobile-view="today" data-i18n="UI.VIEW_TODAY">Today</button><button data-mobile-view="timetable" data-i18n="UI.VIEW_TIMETABLE">Timetable</button><button data-mobile-view="plan" data-i18n="UI.VIEW_PLAN">Plan</button><button data-mobile-view="courses" data-i18n="UI.COURSES">Courses</button></nav>
    </main>

    <dialog id="course-dialog">
      <form id="course-form">
        <input id="course-id" type="hidden" />
        <div class="form-grid">
          <label><span data-i18n="UI.COURSE_NAME">Course name</span><input id="course-name" required maxlength="160" /></label>
          <label><span data-i18n="UI.TEACHER">Teacher</span><input id="teacher" maxlength="120" /></label>
          <label><span data-i18n="UI.LOCATION">Location</span><input id="location" maxlength="120" /></label>
          <label><span data-i18n="UI.WEEKDAY">Weekday</span><select id="weekday"></select></label>
          <label><span data-i18n="UI.START_TIME">Start time</span><input id="start-time" type="time" required /></label>
          <label><span data-i18n="UI.END_TIME">End time</span><input id="end-time" type="time" required /></label>
          <label><span data-i18n="UI.START_WEEK">Start week</span><input id="start-week" type="number" min="1" value="1" required /></label>
          <label><span data-i18n="UI.END_WEEK">End week</span><input id="end-week" type="number" min="1" value="18" required /></label>
          <label><span data-i18n="UI.PATTERN">Week pattern</span><select id="pattern"></select></label>
          <label><span data-i18n="UI.CUSTOM_WEEKS">Custom weeks</span><input id="custom-weeks" placeholder="1,3,5" /></label>
          <label><span data-i18n="UI.COLOR">Color</span><input id="color" type="color" value="#3f51b5" /></label>
          <label><span data-i18n="UI.PROJECT">Assignment project</span><select id="project"></select></label>
          <label><span data-i18n="UI.TASK_PREFIX">Task title prefix</span><input id="task-prefix" placeholder="[Course]" /></label>
        </div>
        <label><span data-i18n="UI.NOTE">Note</span><textarea id="note" rows="3"></textarea></label>
        <label><span data-i18n="UI.OBSIDIAN_LINK">Obsidian link</span><input id="obsidian-link" placeholder="obsidian://open?..." /></label>
        <div class="actions"><button id="course-cancel" type="button" class="plain" data-i18n="UI.CANCEL">Cancel</button><button class="primary" data-i18n="UI.SAVE">Save</button></div>
      </form>
    </dialog>

    <dialog id="event-dialog"><form id="event-form">
      <input id="event-id" type="hidden" /><h2 data-i18n="UI.EVENT">Course event</h2>
      <div class="form-grid"><label><span data-i18n="UI.COURSE_NAME">Course</span><select id="event-course"></select></label><label><span data-i18n="UI.EVENT_TYPE">Type</span><select id="event-type"><option value="assignment">Assignment</option><option value="exam">Exam</option><option value="quiz">Quiz</option><option value="report">Report</option><option value="presentation">Presentation</option><option value="custom">Custom</option></select></label><label><span data-i18n="UI.ASSIGNMENT_TITLE">Title</span><input id="event-title" required /></label><label><span data-i18n="UI.DUE_DAY">Date</span><input id="event-date" type="date" required /></label><label><span data-i18n="UI.START_TIME">Time</span><input id="event-time" type="time" /></label><label><span>SP taskId</span><input id="event-task-id" /></label></div>
      <label><span data-i18n="UI.NOTE">Notes</span><textarea id="event-notes" rows="3"></textarea></label><div class="actions"><button id="event-delete" type="button" class="plain danger" data-i18n="UI.DELETE">Delete</button><button id="event-cancel" type="button" class="plain" data-i18n="UI.CANCEL">Cancel</button><button class="primary" data-i18n="UI.SAVE">Save</button></div>
    </form></dialog>

    <dialog id="exception-dialog"><form id="exception-form">
      <input id="exception-course-id" type="hidden" /><h2 data-i18n="UI.EXCEPTION">Class exception</h2>
      <div class="form-grid"><label><span data-i18n="UI.WEEK">Week</span><input id="exception-week" type="number" min="1" required /></label><label><input id="exception-cancelled" type="checkbox" /><span data-i18n="UI.CANCEL_CLASS">Cancel this class</span></label><label><span data-i18n="UI.WEEKDAY">New weekday</span><select id="exception-weekday"></select></label><label><span data-i18n="UI.START_TIME">New start time</span><input id="exception-start" type="time" /></label><label><span data-i18n="UI.END_TIME">New end time</span><input id="exception-end" type="time" /></label><label><span data-i18n="UI.LOCATION">New location</span><input id="exception-location" /></label><label><span data-i18n="UI.TEACHER">New teacher</span><input id="exception-teacher" /></label></div>
      <div class="actions"><button id="exception-reset" type="button" class="plain danger" data-i18n="UI.RESET_EXCEPTION">Use normal schedule</button><button id="exception-cancel" type="button" class="plain" data-i18n="UI.CANCEL">Cancel</button><button class="primary" data-i18n="UI.SAVE">Save</button></div>
    </form></dialog>

    <dialog id="import-preview-dialog"><form id="import-preview-form"><h2 data-i18n="UI.IMPORT_PREVIEW">Import preview</h2><div id="import-summary" class="panel"></div><div class="preview-scroll"><table class="preview-table"><thead><tr><th data-i18n="UI.COURSE_NAME">Course</th><th data-i18n="UI.WEEKDAY">Day</th><th data-i18n="UI.START_TIME">Time</th><th data-i18n="UI.WEEKS">Weeks</th><th data-i18n="UI.TEACHER">Teacher</th><th data-i18n="UI.LOCATION">Location</th><th>Status</th></tr></thead><tbody id="import-preview-body"></tbody></table></div><div class="actions"><button id="import-preview-cancel" type="button" class="plain" data-i18n="UI.CANCEL">Cancel</button><button class="primary" data-i18n="UI.IMPORT">Import</button></div></form></dialog>

    <dialog id="assignment-dialog">
      <form id="assignment-form">
        <input id="assignment-course-id" type="hidden" />
        <label><span data-i18n="UI.ASSIGNMENT_TITLE">Assignment title</span><input id="assignment-title" required /></label>
        <label><span data-i18n="UI.DUE_DAY">Due date</span><input id="assignment-due" type="date" /></label>
        <label><span data-i18n="UI.ESTIMATE">Estimate</span><input id="assignment-estimate" type="number" min="0" step="5" value="60" /></label>
        <div class="actions"><button id="assignment-cancel" type="button" class="plain" data-i18n="UI.CANCEL">Cancel</button><button class="primary" data-i18n="UI.ADD_ASSIGNMENT">Add assignment</button></div>
      </form>
    </dialog>

    <dialog id="settings-dialog">
      <form id="settings-form">
        <label><span data-i18n="UI.DENSITY">Layout density</span><select id="settings-density"><option value="comfortable" data-i18n="UI.COMFORTABLE">Comfortable</option><option value="compact" data-i18n="UI.COMPACT">Compact</option></select></label>
        <label><span data-i18n="UI.LANGUAGE">Plugin language</span><select id="settings-language"><option value="auto" data-i18n="UI.LANGUAGE_AUTO">Follow SP language</option><option value="zh">中文</option><option value="en">English</option></select></label>
        <label><span data-i18n="UI.ACCENT">Card accent color</span><select id="settings-accent"><option value="theme" data-i18n="UI.FOLLOW_THEME">Follow SP theme</option><option value="blue" data-i18n="UI.BLUE">Blue</option><option value="green" data-i18n="UI.GREEN">Green</option><option value="orange" data-i18n="UI.ORANGE">Orange</option><option value="purple" data-i18n="UI.PURPLE">Purple</option><option value="custom" data-i18n="UI.CUSTOM_COLOR">Custom</option></select></label>
        <label id="custom-color-row"><span data-i18n="UI.CUSTOM_COLOR_VALUE">Custom card color</span><input id="settings-custom-color" type="color" value="#3b82f6" /></label>
        <label><input id="settings-weekends" type="checkbox" /><span data-i18n="UI.SHOW_WEEKENDS">Show weekends</span></label>
        <label><input id="settings-merge-names" type="checkbox" /><span data-i18n="UI.MERGE_NAMES">Merge courses with the same name</span></label>
        <label><span data-i18n="UI.TIME_LABELS">Timeline time labels</span><select id="settings-time-labels"><option value="each" data-i18n="UI.TIME_EACH">Show on every course</option><option value="shared" data-i18n="UI.TIME_SHARED">Merge identical times on the left</option></select></label>
        <div class="actions"><button id="settings-cancel" type="button" class="plain" data-i18n="UI.CANCEL">Cancel</button><button class="primary" data-i18n="UI.SAVE">Save</button></div>
      </form>
    </dialog>

    <dialog id="help-dialog"><form method="dialog">
      <h2 data-i18n="UI.HELP_TITLE">Help</h2>
      <div id="help-copy" class="help-copy"></div>
      <button class="primary" data-i18n="UI.CLOSE">Close</button>
    </form></dialog>
    <dialog id="import-dialog"><form method="dialog">
      <h2 data-i18n="UI.IMPORT">Import</h2>
      <div class="actions"><button id="paste-import" type="button" class="plain" data-i18n="UI.PASTE_IMPORT">Paste web timetable</button><button type="button" class="plain" data-import-accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">XLSX</button><button type="button" class="plain" data-import-accept=".csv,text/csv,text/tab-separated-values">CSV / TSV</button><button type="button" class="plain" data-import-accept=".html,.htm,text/html">HTML</button><button id="docx-import" type="button" class="plain">DOCX</button><button class="plain" data-i18n="UI.CANCEL">Cancel</button></div>
    </form></dialog>
    <dialog id="paste-dialog"><form id="paste-form">
      <h2 data-i18n="UI.PASTE_TITLE">Paste timetable</h2>
      <textarea id="paste-area" rows="8" data-i18n-placeholder="UI.PASTE_HINT" placeholder="Paste a copied timetable here"></textarea>
      <div class="actions"><button id="paste-cancel" type="button" class="plain" data-i18n="UI.CANCEL">Cancel</button><button class="primary" data-i18n="UI.IMPORT">Import</button></div>
    </form></dialog>
    <dialog id="export-dialog"><form method="dialog">
      <h2 data-i18n="UI.EXPORT">Export</h2>
      <div class="actions"><button id="export-ics" type="button" class="plain">ICS</button><button id="export-csv" type="button" class="plain">CSV</button><button id="export-json" type="button" class="plain">JSON backup</button><button class="plain" data-i18n="UI.CANCEL">Cancel</button></div>
    </form></dialog>
    <dialog id="mobile-more-dialog"><form method="dialog"><h2 data-i18n="UI.MORE">More</h2><div class="actions"><button id="mobile-export" type="button" class="plain" data-i18n="UI.EXPORT">Export</button><button id="mobile-sync" type="button" class="plain" data-i18n="UI.SYNC_ALL">Sync</button><button id="mobile-help" type="button" class="plain" data-i18n="UI.HELP">Help</button><button id="mobile-settings" type="button" class="plain" data-i18n="UI.SETTINGS">Settings</button><button class="plain" data-i18n="UI.CANCEL">Cancel</button></div></form></dialog>

    <script>
      let state = { version: 3, semesterId: 'default', semester: { name: '', startDate: '', weeks: 18 }, courses: [], assignments: [], events: [], exceptions: [], semesters: {} };
      let settings = { density: 'comfortable', language: 'auto', accent: 'theme', customColor: '#3b82f6', showWeekends: true, displayMode: 'timeline', mergeNames: false, timeLabels: 'shared' };
      let projects = [];
      let selectedWeek = 1;
      let displayMode = 'timeline';
      let activeView = 'timetable';
      let spTasks = [];
      let pendingImport = null;
      let initialized = false;
      const $ = (id) => document.getElementById(id);
      const isMobile = () => ['android', 'ios'].includes(PluginAPI.cfg?.platform) || matchMedia('(max-width: 680px)').matches;
      const LOCAL_TRANSLATIONS = {

title.</p><h3>Exports</h3><p>ICS is for calendars, CSV for spreadsheets/exchange, and JSON for a complete backup.</p><h3>Mobile and sync</h3><p>Install the plugin once on each device. After the same plugin ID is installed, semesters, courses, events, exceptions, and settings follow SP synced plugin data. The plugin never auto-downloads executable code.</p><h3>FAQ</h3><p><strong>Nothing recognized:</strong> verify weekday headers and a period/time column.<br><strong>Missing classes:</strong> inspect duplicate, invalid, and conflict labels in preview.<br><strong>Missing week:</strong> check week ranges, odd/even rules, and cancellations.<br><strong>HTML/DOCX failure:</strong> the source may not contain actual table data or may be image-only.<br><strong>Conflicts:</strong> warnings do not prevent an explicit save.<br><strong>Reschedule/cancel:</strong> use the course-card exception action for one teaching week.</p>`;

      function timelineLayout(courses) {
        const sorted = [...courses].sort((a, b) => a.startTime.localeCompare(b.startTime));
        const lanes = [];
        return sorted.map((course) => {
          let lane = lanes.findIndex((end) => end <= minutesOfDay(course.startTime));
          if (lane < 0) lane = lanes.length;
          lanes[lane] = minutesOfDay(course.endTime);
          const overlap = sorted.filter((other) => minutesOfDay(other.startTime) < minutesOfDay(course.endTime) && minutesOfDay(course.startTime) < minutesOfDay(other.endTime)).length;
          return { course, lane, lanes: Math.max(lanes.length, overlap) };
        });
      }
      const weekDate = (week, weekday) => { const date = new Date(`${state.semester.startDate}T00:00:00`); date.setDate(date.getDate() + (week - 1) * 7 + weekday - 1); return date; };
      const tasksOnDate = (date) => spTasks.filter((task) => task.dueDay === date && !task.isDone);
      const eventsOnDate = (date) => state.events.filter((event) => event.date === date).sort((a, b) => String(a.time || '23:59').localeCompare(String(b.time || '23:59')));
      const eventLabel = (event) => `<span class="badge">${esc(event.type)}</span> ${event.time ? `${esc(event.time)} ` : ''}${esc(event.title)}`;
      async function renderPlan() {

        let html = `<div class="week-nav"><button class="plain" data-plan-nav="prev">←</button><strong>${esc(await tr('UI.WEEK', { count: selectedWeek }))}</strong><button class="plain" data-plan-nav="next">→</button><button class="primary" data-action="new-event">${esc(await tr('UI.ADD_EVENT'))}</button></div>`;
        for (const day of [1,2,3,4,5,6,7]) {
          const date = localDate(weekDate(selectedWeek, day));
          const courses = coursesForWeek(selectedWeek).filter((course) => Number(course.weekday) === day).sort((a,b) => a.startTime.localeCompare(b.startTime));
          const looseTasks = tasksOnDate(date).filter((task) => !taskCourse(task));

          if (!courses.length && !looseTasks.length && !events.length) continue;

      async function renderToday() {

      }
      async function render() {

      async function renderTimetable() {
        const effectiveDisplayMode = isMobile() ? 'list' : displayMode;

        const weekCourses = coursesForWeek(selectedWeek);
        const conflicts = conflictIds(state.courses, selectedWeek);
        const sharedStartTimes = [...new Set(weekCourses.filter((course) => weekdays.includes(Number(course.weekday))).map((course) => course.startTime))].sort();
        const timelineHours = sharedStartTimes.map((time) => `<span style="top:${Math.max(0, minutesOfDay(time) - 7 * 60)}px">${esc(time)}</span>`).join('');
        $('timetable').className = `week-grid${sharedTimeLabels ? ' with-time-axis timeline-shared' : ' timeline-each'}`;
        $('timetable').style.setProperty('--day-count', weekdays.length);
        let weekHtml = '';
        if (sharedTimeLabels) weekHtml = `<div class="timeline-axis"><div class="timeline-hours">${timelineHours}</div></div>`;
        for (const day of weekdays) {
          const active = weekCourses.filter((course) => Number(course.weekday) === day).sort((a, b) => a.startTime.localeCompare(b.startTime));
          if (effectiveDisplayMode === 'list') { const currentCourse = selectedWeek === semesterWeek(new Date()) ? getCurrentCourse() : null; weekHtml += `<div class="day"><h3>${esc(await tr(`DAY.${day}`))}</h3>${active.length ? active.map((course) => `<div class="class-card${currentCourse?.id === course.id ? ' current-course' : ''}${conflicts.has(course.id) ? ' danger' : ''}" style="--course-color:${esc(course.color)}"><strong>${esc(course.name)}</strong><div class="class-time">${esc(course.startTime)}–${esc(course.endTime)}</div><div class="muted">${esc(course.location)}</div></div>`).join('') : ''}</div>`; }
          else {
            const currentCourse = getCurrentCourse();
            const cards = timelineLayout(active).map(({ course, lane, lanes }) => { const top = Math.max(0, (minutesOfDay(course.startTime) - 7 * 60)); const height = Math.max(30, minutesOfDay(course.endTime) - minutesOfDay(course.startTime)); const label = settings.timeLabels === 'each' ? `<div class="timeline-time-label">${esc(course.startTime)}</div>` : ''; const width = 100 / lanes; return `<div class="class-card timeline-card${conflicts.has(course.id) ? ' danger' : ''}${currentCourse?.id === course.id ? ' current-course' : ''}" style="--course-color:${esc(course.color)};top:${top}px;height:${height}px;left:calc(${lane * width}% + 2px);right:auto;width:calc(${width}% - 4px)">${label}<strong>${esc(course.name)}</strong><div class="class-time">${esc(course.startTime)}–${esc(course.endTime)}</div><div class="muted">${esc(course.location)}</div></div>`; }).join('');
            const now = new Date(), nowMinutes = now.getHours() * 60 + now.getMinutes();
            const current = selectedWeek === semesterWeek(now) && day === (now.getDay() || 7) && nowMinutes >= 7 * 60 && nowMinutes <= 22 * 60 ? `<div class="current-time-line" style="top:${nowMinutes - 7 * 60}px"></div>` : '';
            weekHtml += `<div class="day"><h3>${esc(await tr(`DAY.${day}`))}</h3><div class="timeline"><div class="timeline-track">${current}${cards}</div></div></div>`;

      function taskForCourse(course) {
        const now = new Date();
        const occurrence = nextOccurrence(course, new Date(now.getTime() - 60000));
        const fallback = new Date(now); fallback.setDate(fallback.getDate() + (Number(course.weekday) - (fallback.getDay() || 7) + 7) % 7);
        const dueDate = occurrence?.start || fallback;
        const duration = Math.max(0, minutesOfDay(course.endTime) - minutesOfDay(course.startTime)) * 60000;
        return { title: `${course.taskPrefix || '[Course]'} ${course.name} ${course.startTime}`.trim(), projectId: course.projectId, tagIds: course.tagIds || [], notes: `Course: ${course.name}\nCourse ID: ${course.id}\nTime: ${course.startTime}-${course.endTime}\nLocation: ${course.location || ''}\nTeacher: ${course.teacher || ''}`, dueDay: localDate(dueDate), timeEstimate: duration };
      }
      function groupForKey(key) {

      async function syncCourseGroup(group) {
        if (typeof PluginAPI.addTask !== 'function') { PluginAPI.showSnack?.({ msg: await tr('UI.SYNC_UNSUPPORTED'), type: 'ERROR' }); return false; }
        const representative = group.representative;
        const task = taskForCourse(representative);
        task.notes += `\nSections: ${group.courses.map((course) => `${course.startTime}-${course.endTime} ${course.location || ''} ${course.teacher || ''}`).join(' | ')}`;
        const existingTaskId = group.courses.find((course) => course.taskId)?.taskId;
        let taskId = existingTaskId;
        if (taskId && typeof PluginAPI.updateTask === 'function') { task.id = taskId; await PluginAPI.updateTask(taskId, task); }
        else if (!taskId) taskId = await PluginAPI.addTask(task);
        else { PluginAPI.showSnack({ msg: await tr('UI.SYNC_UNSUPPORTED'), type: 'ERROR' }); return false; }
        group.courses.forEach((course) => { course.taskId = taskId; });
        return true;
      }

      async function syncCourse(course) {
        if (typeof PluginAPI.addTask !== 'function') { PluginAPI.showSnack?.({ msg: await tr('UI.SYNC_UNSUPPORTED'), type: 'ERROR' }); return false; }

        if (course.taskId && typeof PluginAPI.updateTask === 'function') await PluginAPI.updateTask(course.taskId, data);
        else if (!course.taskId) course.taskId = await PluginAPI.addTask(data);
        else { PluginAPI.showSnack({ msg: await tr('UI.SYNC_UNSUPPORTED'), type: 'ERROR' }); return false; }
        return true;
      }

        const details = lines.slice(1).filter((line) => line !== teacher && line !== location && !/^(?:教学班代码|教学班|班号|class\s*code|section|周次|weeks?|wks?|节次|period|时间|time|地点|location|room|教师|老师|teacher|lecturer|instructor)\s*[:：]?/i.test(line) && !/\d{1,2}\s*[:：.]\s*[0-5]\d|(?:周|周次|weeks?|wks?)/i.test(line));
        return {
          id: uid(), taskId: null, name, teacher, location, weekday,
          startTime: cellStartTime, endTime: cellEndTime,
          startWeek: weekSpec.startWeek, endWeek: weekSpec.endWeek, pattern: weekSpec.pattern,
          customWeeks: weekSpec.weeks, color: '#3f51b5', projectId: null,
          note: [classCode ? `教学班: ${classCode}` : '', ...details].filter(Boolean).join(' · '), obsidianLink: null,
        };
      }
      function extractCourses(value, weekday, startTime, endTime) {
        return courseSegments(value).map((segment) => courseFromCell(segment, weekday, startTime, endTime)).filter(Boolean);
      }
      function parseTimetable(grid) {
        const trimmed = trimOuterEmptyRowsAndColumns(grid);
        const header = detectWeekdayHeader(trimmed);
        if (!header) return [];
        const { headerIndex, dayColumns } = header;
        const periodColumn = detectPeriodColumn(trimmed, headerIndex, dayColumns);
        const seen = new Set(), courses = [];
        for (let rowIndex = headerIndex + 1; rowIndex < trimmed.length; rowIndex++) {
          const row = trimmed[rowIndex] || [];
          Object.entries(dayColumns).forEach(([column, weekday]) => {
            const cell = row[Number(column)]; const seenKey = `${cell?.id}:${weekday}`;
            if (!cell || !cell.value || seen.has(seenKey)) return;
            seen.add(seenKey);
            const [startTime] = rowPeriod(trimmed, cell.startRow ?? rowIndex, dayColumns, headerIndex);
            const [, endTime] = rowPeriod(trimmed, cell.endRow ?? rowIndex, dayColumns, headerIndex);
            courses.push(...extractCourses(cell.value, weekday, startTime, endTime));
          });
        }
        return courses;
      }
      const gridToCourses = parseTimetable;
      function weekdayNumber(value) {
        const parsed = weekdayFromText(value);
        const numeric = Number(String(value || '').trim());
        return parsed || (Number.isInteger(numeric) && numeric >= 1 && numeric <= 7 ? numeric : null);
      }
      function normalizePattern(value) {
        const text = String(value || '').trim().toLowerCase();
        if (['odd', '单周', '单'].includes(text)) return 'odd';
        if (['even', '双周', '双'].includes(text)) return 'even';
        if (['custom', '自定义'].includes(text)) return 'custom';
        return 'every';
      }
      function rowsToCourses(rows) {
        rows = trimOuterEmptyRowsAndColumns(rows.map((row, rowIndex) => row.map((value, column) => ({ value, id: `${rowIndex}:${column}`, startRow: rowIndex, endRow: rowIndex }))));
        if (rows.length < 2) return [];
        const fields = rows[0].map((cell) => fieldForHeader(cell?.value));
        if (!fields.includes('name')) {
          return parseTimetable(rows);
        }
        return rows.slice(1).map((row) => {
          const source = {}; fields.forEach((field, index) => { if (field) source[field] = row[index]?.value || ''; });
          const project = projects.find((item) => item.title.toLowerCase() === String(source.project || '').trim().toLowerCase());
          return {
            id: uid(), name: String(source.name || '').trim(), teacher: String(source.teacher || '').trim(), location: String(source.location || '').trim(),
            weekday: weekdayNumber(source.weekday), startTime: String(source.startTime || '08:00').trim(), endTime: String(source.endTime || '09:40').trim(),
            startWeek: Number(source.startWeek) || 1, endWeek: Number(source.endWeek) || state.semester.weeks, pattern: normalizePattern(source.pattern),
            customWeeks: String(source.customWeeks || '').split(/[,，\s]+/).map(Number).filter((week) => Number.isInteger(week) && week > 0), color: /^#[0-9a-f]{6}$/i.test(source.color) ? source.color : '#3f51b5',
            projectId: project?.id || null, note: String(source.note || '').trim(), obsidianLink: String(source.obsidianLink || '').trim() || null,

        });
      }
      function normalizeTime(value) {
        const text = String(value || '').trim().replace(/[：.]/g, ':');
        const compact = text.match(/^(\d{1,2})(\d{2})$/);
        const hourOnly = text.match(/^(\d{1,2})\s*(?:点|时)$/);
        const parts = compact ? [compact[1], compact[2]] : hourOnly ? [hourOnly[1], '0'] : (text.match(/^(\d{1,2})(?:\s*[:点时]\s*(\d{1,2}))?(?:分)?$/) || []).slice(1);
        if (!parts.length) return null;

        return hours >= 0 && hours <= 23 && minutes >= 0 && minutes <= 59 ? `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}` : null;
      }
      function validateImportedCourses(imported) {
        let corrected = 0, skipped = 0; const invalid = [];
        const courses = imported.map((course) => {
          const original = JSON.stringify(course);
          const weekday = weekdayNumber(course.weekday);
          const startTime = normalizeTime(course.startTime);
          const endTime = normalizeTime(course.endTime);
          const name = String(course.name || '').replace(/\s+/g, ' ').trim().slice(0, 160);
          if (!name || !weekday || !startTime || !endTime || minutesOfDay(endTime) <= minutesOfDay(startTime)) { skipped++; invalid.push({ ...course, name: name || String(course.name || ''), _invalid: true }); return null; }
          let startWeek = Math.max(1, Number.parseInt(course.startWeek, 10) || 1);
          let endWeek = Math.max(1, Number.parseInt(course.endWeek, 10) || state.semester.weeks);
          if (startWeek > endWeek) [startWeek, endWeek] = [endWeek, startWeek];
          const maxWeeks = Math.max(1, Number(state.semester.weeks) || 18);
          startWeek = Math.min(startWeek, maxWeeks); endWeek = Math.min(endWeek, maxWeeks);
          const customWeeks = Array.from(new Set((course.customWeeks || []).map(Number).filter((week) => Number.isInteger(week) && week >= startWeek && week <= endWeek))).sort((a, b) => a - b);
          const normalized = { ...course, name, weekday, startTime, endTime, startWeek, endWeek, customWeeks, pattern: course.pattern === 'custom' && !customWeeks.length ? 'every' : course.pattern };

        }).filter(Boolean);

      }
      async function readImportFile(file) {
        const buffer = await file.arrayBuffer();
        try { return new TextDecoder('utf-8', { fatal: true }).decode(buffer).replace(/^\uFEFF/, ''); }
        catch (error) { return new TextDecoder('gb18030').decode(buffer).replace(/^\uFEFF/, ''); }
      }
      async function loadXlsxLibrary() {
        if (window.XLSX) return window.XLSX;
        await new Promise((resolve, reject) => { const script = document.createElement('script'); script.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.mini.min.js'; script.onload = resolve; script.onerror = reject; document.head.appendChild(script); });
        return window.XLSX;
      }
      async function parseXlsx(buffer) {
        const XLSX = await loadXlsxLibrary();
        const workbook = XLSX.read(buffer, { type: 'array', cellDates: false });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        const grid = rawRows.map((row, rowIndex) => row.map((value, column) => ({ value: String(value ?? ''), id: `${rowIndex}:${column}`, startRow: rowIndex, endRow: rowIndex })));
        (sheet['!merges'] || []).forEach((merge) => {
          const source = grid[merge.s.r]?.[merge.s.c];
          if (!source) return;
          for (let row = merge.s.r; row <= merge.e.r; row++) for (let column = merge.s.c; column <= merge.e.c; column++) {
            if (!grid[row]) grid[row] = [];
            grid[row][column] = { value: source.value, id: `${merge.s.r}:${merge.s.c}`, startRow: merge.s.r, endRow: merge.e.r };
          }
        });
        const values = grid.map((row) => row.map((cell) => cell?.value || ''));
        return values[0]?.some((value) => fieldForHeader(value) === 'name') ? rowsToCourses(values) : parseTimetable(grid);
      }
      async function addImportedCourses(parsed) {
        const { courses: imported, corrected, skipped, invalid } = validateImportedCourses(parsed);
        if (!imported.length && !invalid.length) { PluginAPI.showSnack({ msg: await tr('UI.IMPORT_EMPTY'), type: 'ERROR' }); return false; }
        const fingerprints = new Set(state.courses.map((course) => `${course.name}|${course.weekday}|${course.startTime}|${course.endTime}`.toLowerCase()));
        const allCourses = [...state.courses, ...imported];
        const entries = [...imported.map((course) => { const fingerprint = `${course.name}|${course.weekday}|${course.startTime}|${course.endTime}`.toLowerCase(); const duplicate = fingerprints.has(fingerprint); fingerprints.add(fingerprint); const conflict = Array.from({ length: state.semester.weeks }, (_, index) => index + 1).some((week) => conflictIds(allCourses, week).has(course.id)); return { course, duplicate, conflict, invalid: false, selected: !duplicate }; }), ...invalid.map((course) => ({ course, duplicate: false, conflict: false, invalid: true, selected: false }))];
        pendingImport = { entries, corrected, skipped };
        $('import-summary').textContent = `${imported.length} valid · ${corrected} corrected · ${skipped} invalid`;
        const previewLanguage = settings.language === 'zh' ? 'zh' : 'en';
        $('import-preview-body').innerHTML = entries.map((entry, index) => { const course = entry.course; const status = entry.invalid ? 'INVALID' : entry.duplicate ? 'DUPLICATE' : entry.conflict ? 'CONFLICT' : course._importCorrected ? 'CORRECTED' : 'VALID'; const day = course.weekday ? lookup(LOCAL_TRANSLATIONS[previewLanguage], `DAY.${course.weekday}`) : '—'; const statusText = lookup(LOCAL_TRANSLATIONS[previewLanguage], `UI.${status}`) || status; return `<tr class="${entry.invalid ? 'danger' : entry.conflict || entry.duplicate ? 'warning' : ''}"><td><label><input type="checkbox" data-import-index="${index}" ${entry.selected ? 'checked' : ''} ${entry.invalid ? 'disabled' : ''} />${esc(course.name || '—')}</label></td><td>${esc(day)}</td><td>${esc(course.startTime || '—')}–${esc(course.endTime || '—')}</td><td>${esc(course.startWeek || '—')}–${esc(course.endWeek || '—')}</td><td>${esc(course.teacher || '')}</td><td>${esc(course.location || '')}</td><td>${esc(statusText)}</td></tr>`; }).join('');
        $('import-preview-dialog').showModal();
        return true;
      }
      $('import-preview-cancel').onclick = () => { pendingImport = null; $('import-preview-dialog').close(); };
      $('import-preview-form').onsubmit = async (event) => {
        event.preventDefault(); if (!pendingImport) return;
        document.querySelectorAll('[data-import-index]').forEach((checkbox) => { pendingImport.entries[Number(checkbox.dataset.importIndex)].selected = checkbox.checked; });
        const additions = pendingImport.entries.filter((entry) => entry.selected && !entry.invalid && !entry.duplicate).map((entry) => { const course = { ...entry.course }; delete course._importCorrected; return course; });
        state.courses.push(...additions); pendingImport = null; await save(); $('import-preview-dialog').close(); await render(); PluginAPI.showSnack({ msg: await tr('UI.IMPORTED', { count: additions.length }), type: 'SUCCESS' });
      };
      async function importClipboardContent(html, plain) {

      });
      $('docx-import').onclick = async () => PluginAPI.showSnack({ msg: await tr('UI.DOCX_PENDING'), type: 'INFO' });
      $('semester-select').onchange = async () => switchSemester($('semester-select').value);
      $('clear-semester').onclick = async () => {

      $('paste-import').onclick = () => { $('import-dialog').close(); $('paste-area').value = ''; $('paste-dialog').showModal(); $('paste-area').focus(); };
      $('paste-cancel').onclick = () => $('paste-dialog').close();
      $('paste-area').onpaste = async (event) => {

      $('paste-form').onsubmit = async (event) => {
        event.preventDefault();
        const plain = $('paste-area').value;
        if (plain) { await importClipboardContent('', plain); $('paste-dialog').close(); }
      };

      function pad(value) { return String(value).padStart(2, '0'); }
      function icsDate(date) { return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}T${pad(date.getHours())}${pad(date.getMinutes())}00`; }
      async function sendDownload(filename, data, type) {
        try { if (typeof PluginAPI.downloadFile === 'function') { await PluginAPI.downloadFile(filename, data); return; } } catch (error) { console.error(error); }
        try { const blob = new Blob([data], { type: filename.endsWith('.ics') ? 'text/calendar' : 'text/plain' }); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = filename; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
        catch (error) { console.error(error); window.parent.postMessage({ source: 'sp-study-courses', type, filename, data }, '*'); }

      function buildIcs() {
        if (!state.semester.startDate) return;
        const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Super Productivity//Study Courses//EN'];
        for (const course of state.courses) for (let week = course.startWeek; week <= course.endWeek; week++) {
          const occurrence = occurrenceFor(course, week); if (!occurrence) continue; const resolved = occurrence.course;
          lines.push('BEGIN:VEVENT', `UID:${course.id}-${week}@super-productivity`, `DTSTART:${icsDate(occurrence.start)}`, `DTEND:${icsDate(occurrence.end)}`, `SUMMARY:${resolved.name.replace(/[,;]/g, ' ')}`, `LOCATION:${String(resolved.location || '').replace(/[,;]/g, ' ')}`, `DESCRIPTION:${String(resolved.teacher || '').replace(/[\r\n,;]/g, ' ')}`, 'END:VEVENT');
        }
        state.events.forEach((event) => { if (!event.date) return; const start = new Date(`${event.date}T${event.time || '09:00'}:00`); const end = new Date(start.getTime() + 3600000); lines.push('BEGIN:VEVENT', `UID:event-${event.id}@super-productivity`, `DTSTART:${icsDate(start)}`, `DTEND:${icsDate(end)}`, `SUMMARY:${event.title.replace(/[,;]/g, ' ')}`, `DESCRIPTION:${String(event.notes || '').replace(/[\r\n,;]/g, ' ')}`, 'END:VEVENT'); });

      }
      $('export').onclick = () => $('export-dialog').showModal();

      $('export-json').onclick = async () => { await sendDownload(`${state.semester.name || 'timetable'}.json`.replace(/[<>:"/\\|?*]/g, '_'), JSON.stringify({ ...state, settings }, null, 2), 'DOWNLOAD_TEXT'); $('export-dialog').close(); };

      async function init() { await load(); if (!initialized && isMobile()) activeView = 'today'; initialized = true; applySettings(); await applyTranslations(); renderSemesterOptions(); await render(); }

      if (typeof PluginAPI.registerHook === 'function' && PluginAPI.Hooks) {

        PluginAPI.registerHook(PluginAPI.Hooks.PERSISTED_DATA_CHANGED, init);
        for (const hook of [PluginAPI.Hooks.TASK_UPDATE, PluginAPI.Hooks.TASK_COMPLETE, PluginAPI.Hooks.TASK_DELETE].filter(Boolean)) PluginAPI.registerHook(hook, async () => { await refreshTasks(); await render(); });
      }
      init();
    </script>
